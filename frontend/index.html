<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/svg+xml" href="/logo.png" /> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>physics wallah</title> -->
  <style>
    /* Do Not Add In Any CSS file/ */
    body>chatnext-app>div:first-child {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <chatnext-app id="chatnext-app-id" />
  <script>
    //  disblaed shoftcut ctrl +g for chatnext assistant
    const chatnextApp = document.getElementById('chatnext-app-id');
    chatnextApp.disableCtrlG = true;
  </script>

  <script type="module" src="/src/main.tsx"></script>

  <script>
    if (!window.csrf_token) {
      window.csrf_token = "{{ csrf_token }}";
      window.frappe = window.frappe || {};
      window.frappe.csrf_token = window.csrf_token;
    }
  </script>
  <!--
    ChatNext assistant bundle. Resolved server-side by Frappe's bundled_asset()
    Jinja global rather than by fetching /assets/assets.json, which exposed the
    full bundle map of every installed app to anyone, unauthenticated.
    See VAPT finding 16.
  -->
  <script>
    window.cnAppBundleUrl = "{{ bundled_asset('cn-app.bundle.js') }}";
  </script>
  <script>
    // Under `vite dev` the tag above is not rendered and arrives literally, so
    // only inject once it resolved to a real path. Testing the leading slash
    // rather than looking for Jinja delimiters is deliberate: a literal pair of
    // braces in this file is parsed as a print statement and breaks rendering.
    // For the same family of reasons, keep globals here free of a dot followed
    // by two underscores -- frappe.render_template() rejects such templates.
    if (window.cnAppBundleUrl && window.cnAppBundleUrl.charAt(0) === "/") {
      const script = document.createElement("script");
      script.src = window.cnAppBundleUrl;
      document.body.appendChild(script);
    }
  </script>
</body>

</html>
