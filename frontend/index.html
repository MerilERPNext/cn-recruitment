<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* Do Not Add In Any CSS file/ */
    body>chatnext-app>div:first-child {
      display: none !important;
    }
  </style>
</head>

  <script>
    // Runs before first paint so the page never flashes light then swaps to
    // dark. Mirrors ThemeProvider's resolution: stored preference wins, else
    // the OS. Kept inline and dependency-free on purpose — a deferred module
    // would already be too late.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
<body>
  <div id="root"></div>
  <chatnext-app id="chatnext-app-id" />
  <script>
    //  disblaed shoftcut ctrl +g for chatnext assistant
    const chatnextApp = document.getElementById('chatnext-app-id');
    chatnextApp.disableCtrlG = true;
  </script>

  <script type="module" src="/src/main.tsx"></script>

  <script>
    if (!window.csrf_token) {
      window.csrf_token = "{{ csrf_token }}";
      window.frappe = window.frappe || {};
      window.frappe.csrf_token = window.csrf_token;
    }
  </script>
  <script type="module">
    fetch("/assets/assets.json")
      .then((response) => response.json())
      .then((data) => {
        const script = document.createElement("script");
        script.src = data["cn-app.bundle.js"];
        document.body.appendChild(script);
      });
  </script>
</body>

</html>
