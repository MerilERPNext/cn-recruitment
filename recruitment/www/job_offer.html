<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
</head>

{% if doc %}
    {% if expiry_date and expiry_date.strftime('%Y-%m-%d') < frappe.utils.today() %}
        <div>
            <center>
                <h1>Your Offer Letter Has Expired. Please Contact the HR Department.</h1>
            </center>
        </div>
    {% else %}
        <center>
            <div id="operations" style="padding-top:20px">
                <button type="button" class="btn btn-warning" id="reject" onclick="rejectoffer()">Reject</button>
                <button type="button" class="btn btn-primary" id="accept" onclick="accept()">Accept</button>
                <button type="button" class="btn btn-info" id="discuss" onclick="discussFurther()">Want to discuss further</button>
            </div><br>
        </center>
        <div id="result-msg"></div>
        <div>{{ print }}</div>
    {% endif %}
{% else %}
    <div>
        <center>
            <h1>Thank You!</h1>
        </center>
    </div>
{% endif %}

<script>
    $(".action-banner").hide();

    function getCSRF() {
        return (window.frappe && frappe.csrf_token) || window.csrf_token || (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || "";
    }

    async function getJobOfferStatus() {
        const appl = encodeURIComponent(new URLSearchParams(window.location.search).get('appl') || "");
        try {
            const res = await fetch(`${window.location.origin}/api/method/recruitment.job_offer_utils.get_job_offer_status?appl=${appl}`);
            if (!res.ok) throw new Error('Network response was not ok');
            const data = await res.json();
            // Support both {"status": "..."} and {"message": {"status": "..."}}
            return (data && data.status) || (data && data.message && data.message.status) || null;
        } catch (e) {
            console.error('Error fetching job offer status:', e);
            return null;
        }
    }

    function disableActions() {
        document.getElementById('reject')?.setAttribute('disabled', 'true');
        document.getElementById('accept')?.setAttribute('disabled', 'true');
        document.getElementById('discuss')?.setAttribute('disabled', 'true');
    }

    function showMessage(html) {
        const el = document.getElementById('result-msg');
        if (el) el.innerHTML = `<center><h1>${html}</h1></center>`;
        else document.body.insertAdjacentHTML('afterbegin', `<center><h1>${html}</h1></center>`);
    }

    function showAlreadyProcessedMessage(status) {
        document.getElementById("operations")?.remove();
        let msg = "You have already responded to the Offer Letter.";
        if (status === "Accepted") msg = "You have already accepted the Offer Letter.";
        else if (status === "Rejected") msg = "You have already rejected the Offer Letter.";
        else if (status === "Discussion Requested") msg = "You’ve already selected “Want to discuss further.” We’ll get back to you.";
        showMessage(msg);
    }

async function rejectoffer() {
    const status = await getJobOfferStatus();
    if (["Accepted", "Rejected", "Discussion Requested"].includes(status)) {
        showAlreadyProcessedMessage(status);
        return;
    }
    if (!confirm("Are you sure you want to reject this job offer?")) return;

    const appl = new URLSearchParams(window.location.search).get('appl');
    fetch(`${window.location.origin}/api/method/recruitment.job_offer_utils.job_offer_update?status=Rejected&appl=${encodeURIComponent(appl)}`, {
        method: 'POST',
        headers: { 'X-Frappe-CSRF-Token': getCSRF() }
    })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(() => {
        // Update status in backend
        fetch(`${window.location.origin}/api/method/recruitment.job_offer_utils.submit_docs?status=Rejected&appl=${encodeURIComponent(appl)}`, {
            method: 'POST',
            headers: { 'X-Frappe-CSRF-Token': getCSRF() }
        });

        // ✅ No redirect — just show rejection message
        document.getElementById("operations")?.remove();
        showMessage("Thank you for considering us, and we wish you the best in your future endeavors.");
    })
    .catch(e => {
        console.error(e);
        alert("Sorry — couldn’t submit your response. Please try again.");
    });
}

    async function accept() {
        const status = await getJobOfferStatus();
        if (["Accepted", "Rejected", "Discussion Requested"].includes(status)) {
            showAlreadyProcessedMessage(status);
            return;
        }
        const appl = new URLSearchParams(window.location.search).get('appl');

        fetch(`${window.location.origin}/api/method/recruitment.job_offer_utils.job_offer_update?status=Accepted&appl=${encodeURIComponent(appl)}`, {
            method: 'POST',
            headers: { 'X-Frappe-CSRF-Token': getCSRF() }
        })
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(() => {
            // Optional: fire your submit_docs hook, then redirect to thank_you
            fetch(`${window.location.origin}/api/method/recruitment.job_offer_utils.submit_docs?status=Accepted&appl=${encodeURIComponent(appl)}&url=${encodeURIComponent(window.location.origin)}`, {
                method: 'POST',
                headers: { 'X-Frappe-CSRF-Token': getCSRF() }
            }).finally(() => {
                window.location.href = `${window.location.origin}/thank_you`;
            });
        })
        .catch(e => {
            console.error(e);
            alert("Sorry — couldn’t submit your response. Please try again.");
        });
    }

    async function discussFurther() {
        const status = await getJobOfferStatus();
        if (["Accepted", "Rejected", "Discussion Requested"].includes(status)) {
            showAlreadyProcessedMessage(status);
            return;
        }

        const btn = document.getElementById('discuss');
        btn?.setAttribute('disabled', 'true');

        const appl = new URLSearchParams(window.location.search).get('appl');

        fetch(`${window.location.origin}/api/method/recruitment.job_offer_utils.request_discussion`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Frappe-CSRF-Token': getCSRF()
            },
            body: JSON.stringify({ appl, origin: window.location.origin })
        })
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(() => {
            document.getElementById("operations")?.remove();
            showMessage("Thanks! We’ll get back to you.");
        })
        .catch(e => {
            console.error("Discussion request failed:", e);
            btn?.removeAttribute('disabled');
            alert("Sorry — couldn’t submit your request. Please try again.");
        });
    }

    window.onload = async function () {
        const status = await getJobOfferStatus();
        if (["Accepted", "Rejected", "Discussion Requested"].includes(status)) {
            showAlreadyProcessedMessage(status);
        }
    };
</script>
