{% extends "templates/web.html" %}
{% block title %} {{ _("Verify Your Email") }} {% endblock title %}

{% block page_content %}
<div class="verify-email-page">
	<div class="verify-card">
		<h3 class="verify-title">{{ _("Verify Your Email") }}</h3>
		<p class="verify-subtitle text-muted">
			{{ _("Enter your details below and we will check your application status.") }}
		</p>

		<form id="verify-email-form">
			<div class="row">
				<div class="col-sm-6 form-group">
					<label for="first_name">{{ _("First Name") }}</label>
					<input type="text" class="form-control" id="first_name" name="first_name" />
				</div>
				<div class="col-sm-6 form-group">
					<label for="last_name">{{ _("Last Name") }}</label>
					<input type="text" class="form-control" id="last_name" name="last_name" />
				</div>
			</div>
			<div class="form-group">
				<label for="email">{{ _("Email") }} <span class="text-danger">*</span></label>
				<input type="email" class="form-control" id="email" name="email" required />
			</div>
			<button type="submit" class="btn btn-primary" id="verify-submit-btn">
				{{ _("Submit") }}
			</button>
		</form>

		<!-- Result area -->
		<div id="verify-result" class="verify-result mt-4" style="display: none;"></div>
	</div>
</div>
{% endblock %}
