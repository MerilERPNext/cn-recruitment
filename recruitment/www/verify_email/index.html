{% extends "templates/web.html" %}
{% block title %} {{ _("Verify Your Email") }} {% endblock title %}

{% block page_content %}
<div class="verify-email-page">
	<div class="verify-card">
		<div class="verify-badge">
			<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<path d="M4 4h16v16H4z" opacity="0"></path>
				<path d="M22 6l-10 7L2 6"></path>
				<rect x="2" y="4" width="20" height="16" rx="2"></rect>
			</svg>
		</div>
		<h2 class="verify-title">{{ _("Verify Your Email") }}</h2>
		<p class="verify-subtitle">
			{{ _("Enter your details below and we'll check your application status.") }}
		</p>

		<form id="verify-email-form" novalidate>
			<div class="verify-row">
				<div class="verify-field">
					<label for="first_name">{{ _("First Name") }}</label>
					<input type="text" id="first_name" name="first_name" autocomplete="given-name" placeholder="{{ _('Chirag') }}" />
				</div>
				<div class="verify-field">
					<label for="last_name">{{ _("Last Name") }}</label>
					<input type="text" id="last_name" name="last_name" autocomplete="family-name" placeholder="{{ _('Joshi') }}" />
				</div>
			</div>
			<div class="verify-field">
				<label for="email">{{ _("Email") }} <span class="req">*</span></label>
				<input type="email" id="email" name="email" autocomplete="email" placeholder="{{ _('you@example.com') }}" required />
			</div>
			<button type="submit" class="verify-btn" id="verify-submit-btn">
				<span class="btn-label">{{ _("Submit") }}</span>
				<span class="btn-spinner" aria-hidden="true"></span>
			</button>
			<div id="verify-inline-error" class="verify-inline-error" style="display:none;"></div>
		</form>
	</div>
</div>

<!-- Popup modal -->
<div id="verify-modal" class="vm-overlay" style="display:none;" aria-hidden="true">
	<div class="vm-dialog" role="dialog" aria-modal="true" aria-labelledby="vm-title">
		<div id="vm-icon" class="vm-icon"></div>
		<h3 id="vm-title" class="vm-title"></h3>
		<p id="vm-message" class="vm-message"></p>
		<div id="vm-actions" class="vm-actions"></div>
	</div>
</div>
{% endblock %}
