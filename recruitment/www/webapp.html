  <script>
    // Runs before first paint so the page never flashes light then swaps to
    // dark. Mirrors ThemeProvider's resolution: stored preference wins, else
    // light by default (no OS auto-detection). Kept inline and
    // dependency-free on purpose — a deferred module would already be too
    // late.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
