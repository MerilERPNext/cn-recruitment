<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/recruitment/webapp/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
    <script type="module" crossorigin src="/assets/recruitment/webapp/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/recruitment/webapp/index.css">
  </head>
  <body>
    <div id="root"></div>
    <chatnext-app />
    <script>
      if (!window.csrf_token) {
        window.csrf_token = "{{ csrf_token }}";
      }
    </script>
    <script>
      fetch("/assets/assets.json")
        .then(response => response.json())
        .then(data => {
          const script = document.createElement("script");
          script.src = data["cn-app.bundle.js"];
          document.body.appendChild(script);
          console.log(script);
        });
    </script>
  </body>
</html>
